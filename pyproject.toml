[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taja-multilingual-support-bot"
version = "0.1.0"
description = "Python-first multilingual FAQ and customer-support assistant for Taja"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Pelumi Ololade"}
]
keywords = ["chatbot", "fintech", "fastapi", "multilingual", "whatsapp", "nlp", "customer-support"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "jinja2>=3.1,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "rapidfuzz>=3.9,<4.0",
  "scikit-learn>=1.4,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0,<9.0"]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.8,<1.0",
]

[project.urls]
Homepage = "https://www.tajahq.com/"
Documentation = "https://www.tajahq.com/faqs"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taja_bot = ["data/*.json", "templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["taja_bot"]

[tool.coverage.run]
source = ["taja_bot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
